<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="380" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Mockup of the routine TeleFridge report message in Telegram: Box OK at 4.2 degrees Celsius, with a per-sensor min/max/average table, battery level, and collapsed diagnostics.">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="380" height="400" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="380" height="400" fill="#d9e2ea"/>
    <!-- header -->
    <rect x="0" y="0" width="380" height="60" fill="#5288c1"/>
    <circle cx="42" cy="30" r="17" fill="#ffffff"/>
    <text x="42" y="35" text-anchor="middle" font-size="13" font-weight="bold" fill="#5288c1">TF</text>
    <text x="70" y="27" font-size="14" font-weight="bold" fill="#ffffff">TeleFridge Bot</text>
    <text x="70" y="44" font-size="11" fill="#cfe0f2">bot</text>
    <!-- message bubble -->
    <rect x="16" y="76" width="330" height="300" rx="14" fill="#ffffff"/>
    <text x="32" y="100" font-size="11" font-weight="bold" letter-spacing="0.5" fill="#8aa0b6">STICK C</text>
    <circle cx="37" cy="120" r="6" fill="#2bb673"/>
    <text x="50" y="125" font-size="15" font-weight="bold" fill="#12283d">Box OK — 4.2 °C</text>
    <text x="32" y="147" font-size="12.5" font-style="italic" fill="#61738a">steady · fridge 5.1 °C</text>
    <!-- pre table -->
    <rect x="32" y="158" width="264" height="68" rx="7" fill="#eef2f6"/>
    <text font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#31465b" xml:space="preserve">
      <tspan x="44" y="178">         Cur   Min   Max   Avg</tspan>
      <tspan x="44" y="196">Box      4.2   3.6   4.9   4.3</tspan>
      <tspan x="44" y="214">Fridge   5.1   4.4   6.2   5.2</tspan>
    </text>
    <!-- battery -->
    <rect x="32" y="241" width="18" height="11" rx="2" fill="none" stroke="#2bb673" stroke-width="1.4"/>
    <rect x="34" y="243" width="14" height="7" rx="1" fill="#2bb673"/>
    <rect x="50.5" y="244" width="2.5" height="5" rx="1" fill="#2bb673"/>
    <text x="60" y="251" font-size="12.5" fill="#3a4a5c">4.10 V / 95 %</text>
    <!-- collapsed diagnostics blockquote -->
    <path d="M33 269 l7 4 l-7 4 z" fill="#8aa0b6"/>
    <text x="46" y="276" font-size="12" fill="#61738a">16 samples · 12:05–16:05 UTC</text>
    <text x="46" y="293" font-size="11" fill="#8496a8">−67 dBm · up 42 s · fw v1.4.2 · report every 4 h</text>
    <!-- timestamp -->
    <text x="330" y="362" text-anchor="end" font-size="10.5" fill="#9fb0c0">16:05</text>
  </g>
</svg>
