<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="TeleFridge — fridge insulin temperature in Telegram">
  <!--
    TeleFridge horizontal lockup, DARK theme. Pair file: logo.svg.

    Geometry here MUST stay identical to logo.svg — only fills differ — so the
    README header does not shift when a reader toggles GitHub's theme. The
    badge is lifted from #12283d to #1b3a57 — a fill change, not a shape change
    — because the original navy is nearly invisible against GitHub's dark
    canvas (#0d1117).

    See logo.svg for why the mark geometry is duplicated rather than <use>d.
  -->
  <defs>
    <linearGradient id="zones-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.0" stop-color="#2962FF"/><stop offset="0.2" stop-color="#2962FF"/>
      <stop offset="0.2" stop-color="#00B0FF"/><stop offset="0.4" stop-color="#00B0FF"/>
      <stop offset="0.4" stop-color="#00C853"/><stop offset="0.6" stop-color="#00C853"/>
      <stop offset="0.6" stop-color="#FFD600"/><stop offset="0.8" stop-color="#FFD600"/>
      <stop offset="0.8" stop-color="#D50000"/><stop offset="1.0" stop-color="#D50000"/>
    </linearGradient>
    <clipPath id="body-d"><rect x="120" y="104" width="228" height="312" rx="30"/></clipPath>
  </defs>

  <!-- mark -->
  <g transform="translate(6 14) scale(0.21875)">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="#1b3a57"/>
    <rect x="120" y="104" width="228" height="312" rx="30"
          fill="none" stroke="#f0f6fc" stroke-width="20"/>
    <g clip-path="url(#body-d)">
      <rect x="120" y="232" width="228" height="34" fill="url(#zones-d)"/>
    </g>
    <rect x="190" y="296" width="40" height="16" rx="4" fill="#7cb2e8"/>
    <rect x="197" y="310" width="26" height="12" fill="#7cb2e8"/>
    <rect x="178" y="320" width="64" height="72" rx="9" fill="#f0f6fc"/>
    <rect x="306" y="152" width="18" height="56" rx="9" fill="#a8bccd"/>
    <rect x="306" y="292" width="18" height="88" rx="9" fill="#a8bccd"/>
    <g transform="translate(346 30) scale(5.4)">
      <path d="M2 21 L23 12 L2 3 L2 10 L17 12 L2 14 Z" fill="#7cb2e8"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="136" y="72" font-size="46" font-weight="bold" letter-spacing="-1">
    <tspan fill="#6fa8dc">Tele</tspan><tspan fill="#e6edf3">Fridge</tspan>
  </text>
  <text x="138" y="100" font-size="15" fill="#8aa0b6">Fridge insulin temperature in Telegram</text>
</svg>
