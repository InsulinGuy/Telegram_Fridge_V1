<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TeleFridge logo: a fridge with a five-colour temperature-zone band across its door, and a paper plane leaving it.">
  <!--
    TeleFridge mark. Hand-authored, self-contained: no <image>, no external
    href, no script, no webfont — GitHub proxies SVGs through camo and strips
    anything external.

    The five-colour band is DECORATIVE ONLY. It borrows the hues of
    zone_color() in logger/helpers.h, but it is NOT a third rendering of the
    zone scale and must never be added to the zone_emoji()/zone_color()
    agreement assertion in test/test_report.cpp. That pair is kept adjacent
    and tested because the two drifted once (issue #2); this file is brand,
    not a status surface, and nothing reads a temperature from it.

    Detail budget is set by the 32 px case (Telegram avatar, browser tab):
    at that size only the badge, the fridge outline and the colour band
    survive, so the band is deliberately heavy and full-width. Check
    docs/img/ renders at 256/64/32/16 px before changing any geometry here.
  -->
  <defs>
    <!-- Five discrete zones, hard-edged: 🟦 blue · 🔷 cyan · 🟢 green · 🟡 amber · 🔴 red -->
    <linearGradient id="zones" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.0" stop-color="#2962FF"/><stop offset="0.2" stop-color="#2962FF"/>
      <stop offset="0.2" stop-color="#00B0FF"/><stop offset="0.4" stop-color="#00B0FF"/>
      <stop offset="0.4" stop-color="#00C853"/><stop offset="0.6" stop-color="#00C853"/>
      <stop offset="0.6" stop-color="#FFD600"/><stop offset="0.8" stop-color="#FFD600"/>
      <stop offset="0.8" stop-color="#D50000"/><stop offset="1.0" stop-color="#D50000"/>
    </linearGradient>
    <!-- clips the zone band to the fridge's rounded body -->
    <clipPath id="body">
      <rect x="120" y="104" width="228" height="312" rx="30"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#12283d"/>

  <!-- fridge body -->
  <rect x="120" y="104" width="228" height="312" rx="30"
        fill="none" stroke="#e6edf3" stroke-width="20"/>

  <!-- door split: the temperature-zone band, clipped to the body -->
  <g clip-path="url(#body)">
    <rect x="120" y="232" width="228" height="34" fill="url(#zones)"/>
  </g>

  <!-- handles -->
  <rect x="306" y="152" width="18" height="56" rx="9" fill="#8aa0b6"/>
  <rect x="306" y="292" width="18" height="88" rx="9" fill="#8aa0b6"/>

  <!-- paper plane: the Telegram message on its way out -->
  <g transform="translate(346 30) scale(5.4)">
    <path d="M2 21 L23 12 L2 3 L2 10 L17 12 L2 14 Z" fill="#5288c1"/>
  </g>
</svg>
